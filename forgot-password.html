<!doctype html>
<html lang="en"><head><script src="https://unpkg.com/lucide@latest"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forgot password | Voice AI Studio</title><link rel="stylesheet" href="./style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./supabase-config.js"></script><style>.auth-wrap{max-width:520px;margin:48px auto;padding:24px}.auth-card{padding:26px;border:1px solid #334155;border-radius:18px}.auth-card label{display:block;margin:14px 0 6px}.auth-card input{box-sizing:border-box;width:100%;padding:12px;border-radius:9px}.auth-card button{margin-top:18px;padding:12px;width:100%;cursor:pointer}.auth-status{min-height:1.5em}.error{color:#f87171}.success{color:#4ade80}</style></head>
<body>
<header class="navbar">
<a href="index.html" class="logo"><span class="logo-mark"><i data-lucide="audio-lines"></i></span><span>VoiceAI</span></a>
<nav class="nav-links"><a href="index.html">Home</a><a href="tools.html">AI Tools</a><a href="voices.html">Voices</a><a href="studio.html">Studio</a><a href="pricing.html">Pricing</a></nav>
<div class="nav-actions"><a href="login.html" class="nav-login">Login</a><a href="signup.html" class="primary-btn">Get Started</a></div>
</header>
<header class="site-header"><a href="./index.html" class="logo">Voice AI Studio</a><nav><a href="./login.html">Log in</a><a href="./signup.html">Create account</a></nav></header><main class="container auth-wrap"><section class="auth-card"><h1>Forgot password</h1><p>We’ll email you a secure password reset link.</p><form id="resetRequest"><label for="email">Account email</label><input id="email" type="email" autocomplete="email" required><button id="sendBtn" class="button button-primary" type="submit">Send reset link</button></form><p id="status" class="auth-status" role="status" aria-live="polite"></p><a href="./login.html">Back to log in</a></section></main><script>(()=>{const form=document.getElementById("resetRequest"),status=document.getElementById("status"),btn=document.getElementById("sendBtn");form.addEventListener("submit",async e=>{e.preventDefault();if(!window.supabaseClient?.auth){status.textContent="Supabase client failed to initialize.";status.className="auth-status error";return}btn.disabled=true;status.textContent="Sending…";try{const {error}=await window.supabaseClient.auth.resetPasswordForEmail(document.getElementById("email").value.trim(),{redirectTo:new URL("reset-password.html",location.href).href});if(error)throw error;status.textContent="If this email is registered, a reset link will arrive shortly.";status.className="auth-status success"}catch(err){status.textContent=err.message||"Could not send reset email.";status.className="auth-status error"}finally{btn.disabled=false}})})();</script><script>if(window.lucide)lucide.createIcons();</script></body></html>
