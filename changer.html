<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Voice Changer | Voice AI Studio</title><link rel="stylesheet" href="./style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./supabase-config.js"></script><script src="./api-config.js"></script>
<style>
.tool-wrap{max-width:850px;margin:30px auto;padding:18px}.tool-card{border:1px solid #334155;border-radius:16px;padding:22px;margin:18px 0}.tool-card label{display:block;margin:14px 0 7px;font-weight:600}.tool-card input,.tool-card select{box-sizing:border-box;width:100%;padding:12px;border-radius:9px}.tool-btn{padding:12px 18px;margin-top:16px;border-radius:9px;cursor:pointer}.tool-status{white-space:pre-wrap;overflow-wrap:anywhere;margin-top:14px}.tool-audio{width:100%;margin-top:15px}
</style></head>
<body><header class="site-header"><a href="index.html" class="logo">VoiceAI</a><nav><a href="tts.html">Text to Speech</a><a href="voice-library.html">Voice Library</a><a href="voice-isolator.html">Voice Isolator</a><a href="studio.html">Studio</a></nav></header>
<main class="tool-wrap"><h1>Voice Changer</h1><p>Upload audio and convert it to the selected ElevenLabs voice. Requires sign-in and a configured ElevenLabs API key.</p>
<section class="tool-card"><label for="changerAudio">Source audio (up to 4 MB)</label><input id="changerAudio" type="file" accept="audio/*">
<label for="changerVoice">Target voice</label><select id="changerVoice"><option value="">Loading voices…</option></select>
<button class="tool-btn" id="changerRefresh" type="button">Refresh voices</button> <button class="tool-btn" id="changerRun" type="button">Convert voice</button>
<p id="changerCount">0 voices loaded</p><div id="changerStatus" class="tool-status" role="status" aria-live="polite"></div></section>
<section class="tool-card" id="changerResult" hidden><h2>Converted audio</h2><audio id="changerPlayer" class="tool-audio" controls></audio><p><a id="changerDownload" download="voiceai-changed.mp3">Download converted audio</a></p></section></main>
<script>
(()=>{"use strict";const $=id=>document.getElementById(id);let audioUrl=null,loading=false,running=false;const status=s=>{$("changerStatus").textContent=s};
async function token(){const c=window.supabaseClient;if(!c?.auth?.getSession)throw Error("Supabase client is not initialized.");const {data,error}=await c.auth.getSession();if(error)throw Error(error.message);if(!data.session?.access_token)throw Error("Please sign in before using Voice Changer.");return data.session.access_token}
async function loadVoices(){if(loading)return;loading=true;$("changerRefresh").disabled=true;$("changerVoice").replaceChildren(new Option("Loading voices…",""));status("Loading ElevenLabs voices…");try{const t=await token();const r=await fetch("https://axeqcbavupmpijhaaite.supabase.co/functions/v1/voiceai-voices",{headers:{Authorization:"Bearer "+t}});const p=await r.json();if(!r.ok||!p.success||!Array.isArray(p.voices))throw Error(p.error||"Could not load voices.");const sel=$("changerVoice");sel.replaceChildren(new Option("Select a target voice…",""));p.voices.forEach(v=>{if(v.voice_id&&v.name)sel.add(new Option(v.name+" — "+(v.category||"Voice"),v.voice_id))});$("changerCount").textContent=p.voices.length+" voices loaded";status(p.voices.length?"Voices loaded.":"No voices returned. Check ElevenLabs account and API key.");}catch(e){$("changerVoice").replaceChildren(new Option("Voices unavailable",""));$("changerCount").textContent="0 voices loaded";status(e.message||"Failed to load voices.");}finally{loading=false;$("changerRefresh").disabled=false}}
async function run(){if(running)return;const file=$("changerAudio").files[0],voice_id=$("changerVoice").value;if(!file)return status("Choose an audio file first.");if(file.size>4*1024*1024)return status("Audio must be 4 MB or smaller.");if(!voice_id)return status("Select a target voice.");running=true;$("changerRun").disabled=true;$("changerResult").hidden=true;status("Converting audio…");try{const t=await token(),base64=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(String(reader.result).split(",")[1]||"");reader.onerror=()=>reject(Error("Could not read the audio file."));reader.readAsDataURL(file)});const r=await fetch("https://axeqcbavupmpijhaaite.supabase.co/functions/v1/voiceai-voice-changer",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+t},body:JSON.stringify({voice_id,audio_base64:base64,mime_type:file.type||"audio/mpeg"})});if(!r.ok){let m="Conversion failed ("+r.status+")";try{m=(await r.json()).error||m}catch{}throw Error(m)}const blob=await r.blob();if(!blob.size)throw Error("Provider returned empty audio.");if(audioUrl)URL.revokeObjectURL(audioUrl);audioUrl=URL.createObjectURL(blob);$("changerPlayer").src=audioUrl;$("changerDownload").href=audioUrl;$("changerResult").hidden=false;status("Voice conversion completed.");}catch(e){status(e.message||"Voice conversion failed.");}finally{running=false;$("changerRun").disabled=false}}
$("changerRefresh").addEventListener("click",loadVoices);$("changerRun").addEventListener("click",run);window.addEventListener("beforeunload",()=>{if(audioUrl)URL.revokeObjectURL(audioUrl)});loadVoices()})();
</script></body></html>
