<!doctype html>
<html lang="en">
<head><script src="https://unpkg.com/lucide@latest"></script>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Voice AI Studio — Text to Speech</title>
<link rel="stylesheet" href="./style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./supabase-config.js"></script><script src="./api-config.js"></script>
<style>
.tts-wrap{max-width:900px;margin:32px auto;padding:20px}.tts-card{padding:22px;border:1px solid #334155;border-radius:16px;margin:18px 0}
.tts-card label{display:block;margin:14px 0 6px;font-weight:600}.tts-card textarea,.tts-card select,.tts-card input{box-sizing:border-box;width:100%;padding:12px;border-radius:9px}
.tts-card textarea{min-height:150px}.tts-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}.tts-btn{padding:12px 18px;margin:12px 8px 0 0;border-radius:9px;cursor:pointer}
#ttsStatus{white-space:pre-wrap;overflow-wrap:anywhere;margin-top:14px}#ttsAudio{width:100%;margin-top:16px}
@media(max-width:600px){.tts-row{grid-template-columns:1fr}.tts-wrap{padding:12px}}
</style></head>
<body>
<header class="navbar">
<a href="index.html" class="logo"><span class="logo-mark"><i data-lucide="audio-lines"></i></span><span>VoiceAI</span></a>
<nav class="nav-links"><a href="index.html">Home</a><a href="tools.html">AI Tools</a><a href="voices.html">Voices</a><a href="studio.html">Studio</a><a href="pricing.html">Pricing</a></nav>
<div class="nav-actions"><a href="login.html" class="nav-login">Login</a><a href="signup.html" class="primary-btn">Get Started</a></div>
</header>
<main class="tts-wrap">
<h1>Text to Speech</h1><p>Select an available voice and generate speech. Provider access and credits are required.</p>
<section class="tts-card">
<label for="ttsText">Text</label><textarea id="ttsText" maxlength="5000" placeholder="Type text to speak..."></textarea>
<p><small><span id="ttsChars">0</span>/5000 characters</small></p>
<div class="tts-row"><div><label for="ttsSearch">Search voices</label><input id="ttsSearch" type="search" placeholder="Search by name"></div>
<div><label for="ttsLanguage">Voice language</label><select id="ttsLanguage"><option value="hindi" selected>Hindi</option><option value="gujarati">Gujarati</option><option value="english">English</option></select></div></div><label for="ttsVoice">Voice</label><select id="ttsVoice"><option value="">Loading voices…</option></select>
<label for="ttsModel">Model</label><select id="ttsModel"><option value="eleven_multilingual_v2">Multilingual v2</option><option value="eleven_flash_v2_5">Flash v2.5</option><option value="eleven_turbo_v2_5">Turbo v2.5</option></select>
<button class="tts-btn" id="ttsRefresh" type="button">Refresh Voices</button><button class="tts-btn" id="ttsGenerate" type="button">Generate Speech</button>
<p id="ttsCount">0 voices loaded</p><div id="ttsStatus" role="status" aria-live="polite"></div>
</section><section class="tts-card" id="ttsResult" hidden><h2>Generated audio</h2><audio id="ttsAudio" controls></audio><p><a id="ttsDownload" download="voiceai-speech.mp3">Download audio</a></p></section>
</main>
<script>
(()=>{"use strict";
const $=id=>document.getElementById(id), voices=new Map();let audioUrl=null,loading=false,generating=false;
const status=(s,kind="")=>{$("ttsStatus").textContent=s;$("ttsStatus").className=kind};
async function token(){const c=window.supabaseClient;if(!c?.auth?.getSession)throw Error("Supabase client is not initialized.");const {data,error}=await c.auth.getSession();if(error)throw Error(error.message);if(!data.session?.access_token)throw Error("Please sign in before using Text to Speech.");return data.session.access_token}
async function request(url,options={}){const t=await token();const r=await fetch(url,{...options,headers:{...(options.headers||{}),Authorization:"Bearer "+t}});if(!r.ok){let m="Request failed ("+r.status+")";try{const p=await r.json();m=p.error||p.message||m}catch{}throw Error(m)}return r}
function render(){const q=$("ttsSearch").value.trim().toLowerCase(),language=$("ttsLanguage").value,select=$("ttsVoice"),prev=select.value;select.replaceChildren(new Option("Select a voice…",""));for(const v of voices.values()){const details=String(v.name+" "+(v.description||"")+" "+(v.category||"")+" "+JSON.stringify(v.labels||{})).toLowerCase();if(q&&!details.includes(q))continue;const lang=String(v.labels?.language||v.language||"").toLowerCase();const multilingual=/multi.?lingual|multiple languages|all languages/i.test(lang+" "+details);const hindi=/hindi|hi-in|\bhi\b/.test(lang)||/hindi|hindustani|indian hindi/i.test(details)||multilingual;const english=/english|en-us|en-gb|en-in|\ben\b/.test(lang)||/english|american accent|british accent|australian accent/i.test(details);const gujarati=/gujarati|guj|gu-in/.test(lang)||/gujarati|gujju/i.test(details);if(language==="hindi"&&!hindi)continue;if(language==="gujarati"&&!gujarati)continue;if(language==="english"&&!english)continue;select.add(new Option(v.name+" — "+(v.category||v.labels?.language||"Voice"),v.voice_id))}if([...select.options].some(o=>o.value===prev))select.value=prev;$("ttsCount").textContent=select.options.length-1+" matching voices loaded"}
async function load(){if(loading)return;loading=true;$("ttsRefresh").disabled=true;$("ttsVoice").replaceChildren(new Option("Loading voices…",""));status("Loading shared and account voices (up to 1,000 per source)…");try{voices.clear();for(const source of ["library","account"]){let nextToken="",page=0;do{const url=new URL("/api/voices",window.location.href);url.searchParams.set("source",source);if(source==="library"&&page>0)url.searchParams.set("page",String(page+1));if(source==="account"&&nextToken)url.searchParams.set("next_page_token",nextToken);const response=await request(url.toString());const p=await response.json();if(!p.success||!Array.isArray(p.voices))throw Error(p.error||"Invalid voice response.");p.voices.forEach(v=>{if(v?.voice_id&&v?.name)voices.set(v.voice_id,v)});nextToken=typeof p.next_page_token==="string"?p.next_page_token:"";page++;status("Loading voices: "+voices.size+" found…");}while((source==="library"?nextToken!=="" : nextToken!=="")&&page<10);}while(false); }render();try{const saved=JSON.parse(sessionStorage.getItem("voiceai_selected_voice")||"null");if(saved?.voice_id&&voices.has(saved.voice_id))$("ttsVoice").value=saved.voice_id;sessionStorage.removeItem("voiceai_selected_voice")}catch(_){}status(voices.size+" voices loaded from the connected voice service.","success");if(!voices.size)status("No voices returned. Check the voice provider configuration.");}catch(e){$("ttsVoice").replaceChildren(new Option("Voices unavailable",""));$("ttsCount").textContent="0 voices loaded";status(e.message||"Could not load voices.","error")}finally{loading=false;$("ttsRefresh").disabled=false}}
async function generate(){if(generating)return;const text=$("ttsText").value.trim(),voice_id=$("ttsVoice").value;if(!text)return status("Enter text first.","error");if(!voice_id)return status("Select a voice first.","error");generating=true;$("ttsGenerate").disabled=true;$("ttsResult").hidden=true;status("Generating speech…");try{const r=await request("/api/tts",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text,voice_id,model_id:$("ttsModel").value,output_format:"mp3_44100_128"})});const blob=await r.blob();if(!blob.size)throw Error("Provider returned empty audio.");if(audioUrl)URL.revokeObjectURL(audioUrl);audioUrl=URL.createObjectURL(blob);$("ttsAudio").src=audioUrl;$("ttsDownload").href=audioUrl;$("ttsResult").hidden=false;status("Speech generated successfully.","success")}catch(e){status(e.message||"Speech generation failed.","error")}finally{generating=false;$("ttsGenerate").disabled=false}}
try{const draft=sessionStorage.getItem("voiceai_tts_text");if(draft!==null){$("ttsText").value=draft;$("ttsChars").textContent=draft.length;sessionStorage.removeItem("voiceai_tts_text")}}catch(_){};$("ttsText").addEventListener("input",()=>{$("ttsChars").textContent=$("ttsText").value.length});$("ttsSearch").addEventListener("input",render);$("ttsLanguage").addEventListener("change",render);$("ttsRefresh").addEventListener("click",load);$("ttsGenerate").addEventListener("click",generate);window.addEventListener("beforeunload",()=>{if(audioUrl)URL.revokeObjectURL(audioUrl)});load();
})();
</script><script>if(window.lucide)lucide.createIcons();</script></body></html>
