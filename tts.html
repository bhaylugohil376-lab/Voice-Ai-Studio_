<!doctype html>
<html lang="en">
<head><script src="https://unpkg.com/lucide@latest"></script>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Voice AI Studio — Text to Speech</title>
<link rel="stylesheet" href="./style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./supabase-config.js"></script><script src="./api-config.js"></script>
<style>
.tts-wrap{max-width:900px;margin:32px auto;padding:20px}.tts-card{padding:22px;border:1px solid #334155;border-radius:16px;margin:18px 0}
.tts-card label{display:block;margin:14px 0 6px;font-weight:600}.tts-card textarea,.tts-card select,.tts-card input{box-sizing:border-box;width:100%;padding:12px;border-radius:9px}
.tts-card textarea{min-height:150px}.tts-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}.tts-btn{padding:12px 18px;margin:12px 8px 0 0;border-radius:9px;cursor:pointer}
#ttsStatus{white-space:pre-wrap;overflow-wrap:anywhere;margin-top:14px}#ttsAudio{width:100%;margin-top:16px}
@media(max-width:600px){.tts-row{grid-template-columns:1fr}.tts-wrap{padding:12px}}
</style></head>
<body>
<header class="navbar">
<a href="index.html" class="logo"><span class="logo-mark"><i data-lucide="audio-lines"></i></span><span>VoiceAI</span></a>
<nav class="nav-links"><a href="index.html">Home</a><a href="tools.html">AI Tools</a><a href="voices.html">Voices</a><a href="studio.html">Studio</a><a href="pricing.html">Pricing</a></nav>
<div class="nav-actions"><a href="login.html" class="nav-login">Login</a><a href="signup.html" class="primary-btn">Get Started</a></div>
</header>
<main class="tts-wrap">
<h1>Text to Speech</h1><p>Generate speech with free TTS voices. No ElevenLabs credits required.</p>
<section class="tts-card">
<label for="ttsText">Text</label><textarea id="ttsText" maxlength="2000" placeholder="Type up to 2,000 characters to speak..."></textarea>
<p><small><span id="ttsChars">0</span>/2,000 characters (free testing)</small></p>
<div class="tts-row"><div><label for="ttsLanguage">Voice language</label><select id="ttsLanguage"><option value="hindi" selected>Hindi</option><option value="gujarati">Gujarati</option><option value="english">English</option></select></div><div><label for="ttsEmotion">Voice emotion</label><select id="ttsEmotion"><option value="auto" selected>Automatic emotion</option><option value="neutral">Neutral</option><option value="happy">Happy / excited</option><option value="sad">Sad / emotional</option><option value="angry">Angry / intense</option><option value="romantic">Romantic / gentle</option><option value="professional">Professional / confident</option></select></div></div><label for="ttsVoice">Real provider voice</label><div class="tts-row" style="grid-template-columns:minmax(0,1fr) auto"><select id="ttsVoice"><option value="">Loading voices…</option></select><button class="tts-btn" id="ttsPreview" type="button" disabled>▶ Preview voice</button></div><audio id="ttsPreviewAudio" controls hidden style="width:100%;margin-top:10px"></audio>
<label for="ttsProvider">Voice provider</label><select id="ttsProvider"><option value="ttsai">Free TTS models (Kokoro/Piper/VITS/MeloTTS)</option><option value="freetts" selected>FreeTTS Neural Library — 2,250+ voices (free tier limits)</option><option value="elevenlabs_shared">ElevenLabs Shared Voice Library (may require credits)</option><option value="elevenlabs">My ElevenLabs voices</option></select><label for="ttsModel">Model</label><select id="ttsModel"><option value="all" selected>All free models</option><option value="all_available">All available models (some may use credits)</option><option value="kokoro">Kokoro — free</option><option value="piper">Piper — free</option><option value="vits">VITS — free</option><option value="melotts">MeloTTS — free</option><option value="chatterbox">Chatterbox — paid/credits</option><option value="cosyvoice2">CosyVoice 2 — credits</option><option value="bark">Bark — credits</option><option value="dia">Dia — credits</option><option value="glm-tts">GLM-TTS — credits</option><option value="gpt-sovits">GPT-SoVITS — credits</option><option value="indextts2">IndexTTS-2 — credits</option><option value="openvoice">OpenVoice — paid/credits</option><option value="orpheus">Orpheus — credits</option><option value="parler">Parler — credits</option><option value="qwen3-tts">Qwen3-TTS — credits</option><option value="sesame-csm">Sesame CSM — paid/credits</option><option value="spark">Spark — credits</option><option value="styletts2">StyleTTS2 — paid/credits</option><option value="tortoise">Tortoise — paid/credits</option></select>
<button class="tts-btn" id="ttsRefresh" type="button">Refresh Voices</button><button class="tts-btn" id="ttsGenerate" type="button">Generate Speech</button>
<p id="ttsCount">0 voices loaded</p><div id="ttsStatus" role="status" aria-live="polite"></div>
</section><section class="tts-card" id="ttsResult" hidden><h2>Generated audio</h2><audio id="ttsAudio" controls></audio><p><a id="ttsDownload" download="voiceai-speech.mp3">Download audio</a></p></section>
</main>
<script>
(()=>{"use strict";
const $=id=>document.getElementById(id), voices=new Map();let audioUrl=null,previewUrl=null,loading=false,generating=false,freettsDiagnostics=null;
const status=(s,kind="")=>{$("ttsStatus").textContent=s;$("ttsStatus").className=kind};
async function request(url,options={}){const headers={...(options.headers||{})};try{const c=window.supabaseClient;if(c?.auth?.getSession){const {data}=await c.auth.getSession();if(data?.session?.access_token)headers.Authorization="Bearer "+data.session.access_token}}catch(_){}const r=await fetch(url,{...options,headers});if(!r.ok){let m="Request failed ("+r.status+")";try{const p=await r.json();m=p.error||p.message||m}catch{}throw Error(m)}return r}
function render(){const language=$("ttsLanguage").value,select=$("ttsVoice"),prev=select.value;select.replaceChildren(new Option("Select a voice…",""));const all=[...voices.entries()];const matches=all.filter(([,v])=>{const details=String(v.name+" "+(v.description||"")+" "+(v.category||"")+" "+JSON.stringify(v.labels||{})).toLowerCase();const lang=String(v.labels?.language||v.language||"").toLowerCase();const hindi=/hindi|hi-in|\\bhi\\b/.test(lang)||/hindi|hindustani|indian hindi/i.test(details);const english=/english|en-us|en-gb|en-in|\\ben\\b/.test(lang)||/english|american accent|british accent|australian accent/i.test(details);const gujarati=/gujarati|guj|gu-in/.test(lang)||/gujarati|gujju/i.test(details);return language==="hindi"?hindi:language==="gujarati"?gujarati:english});const list=matches.length?matches:all;for(const [key,v] of list)select.add(new Option(v.name+" — "+(v.model_id||v.category||v.labels?.language||"Voice"),key));$("ttsPreview").disabled=!select.value;if([...select.options].some(o=>o.value===prev))select.value=prev;$("ttsCount").textContent=list.length+(matches.length?" matching voices loaded":" voices loaded (language labels unavailable; showing all)");}
async function load(){if(loading)return;loading=true;$("ttsRefresh").disabled=true;$("ttsVoice").replaceChildren(new Option("Loading voices…",""));const provider=$("ttsProvider").value;status(provider==="ttsai"?"Loading free-provider voices…":provider==="freetts"?"Loading FreeTTS neural voice catalogue…":"Loading ElevenLabs shared and account voices…");try{voices.clear();freettsDiagnostics=null;const sources=provider==="ttsai"?["ttsai"]:provider==="freetts"?["freetts"]:provider==="elevenlabs_shared"?["library"]:["account"];for(const source of sources){const selectedModel=$("ttsModel").value;const freeModels=["kokoro","piper","vits","melotts"];const allModels=[...freeModels,"chatterbox","cosyvoice2","bark","dia","glm-tts","gpt-sovits","indextts2","openvoice","orpheus","parler","qwen3-tts","sesame-csm","spark","styletts2","tortoise"];const models=source==="ttsai"?(selectedModel==="all"?freeModels:selectedModel==="all_available"?allModels:[selectedModel]):[null];for(const model of models){try{let nextToken="",page=0,hasMore=true;do{const url=new URL("/api/voices",window.location.href);url.searchParams.set("source",source);if(source==="ttsai"){url.searchParams.set("model",model);if(page>0)url.searchParams.set("page",String(page+1));if(nextToken)url.searchParams.set("next_page_token",nextToken);}if(source==="freetts"&&page>0)url.searchParams.set("page",String(page+1));if(source==="library"&&page>0)url.searchParams.set("next_page_token",String(page));if(source==="account"&&nextToken)url.searchParams.set("next_page_token",nextToken);const response=await request(url.toString());const p=await response.json();if(!p.success||!Array.isArray(p.voices))throw Error(p.error||"Invalid voice response.");if(source==="freetts")freettsDiagnostics={count:p.count,raw_count:p.raw_count,total_count:p.total_count,upstream_shape:p.upstream_shape,diagnostic:p.diagnostic};p.voices.forEach(v=>{if(v?.voice_id&&v?.name){const modelId=v.model_id||v.category||model||"kokoro";const key=source==="ttsai"?modelId+":"+v.voice_id:source+":"+v.voice_id;voices.set(key,{...v,provider:source,model_id:modelId})}});nextToken=typeof p.next_page_token==="string"?p.next_page_token:"";hasMore=Boolean(p.has_more);page++;status("Loading "+(model?model+" model — ":"")+"voices: "+voices.size+(Number.isFinite(Number(p.total_count))&&Number(p.total_count)>0?" / "+Number(p.total_count):"")+" found…");}while((nextToken||hasMore)&&page<20);}catch(modelError){console.warn("TTS model catalogue unavailable:",model,modelError?.message||modelError);}}}render();try{const saved=JSON.parse(sessionStorage.getItem("voiceai_selected_voice")||"null");if(saved?.voice_id){const savedEntry=[...voices.entries()].find(([,v])=>v.voice_id===saved.voice_id&&(!saved.model_id||v.model_id===saved.model_id));if(savedEntry)$("ttsVoice").value=savedEntry[0]}sessionStorage.removeItem("voiceai_selected_voice")}catch(_){}status(voices.size+(provider==="ttsai"?" free-model voices loaded.":provider==="freetts"?" unique FreeTTS neural voices loaded.":provider==="elevenlabs_shared"?" shared-library voices loaded.":" account voices loaded."),"success");if(provider==="freetts"&&freettsDiagnostics){const d=freettsDiagnostics;status(voices.size+" unique FreeTTS voices loaded. Upstream raw rows: "+(d.raw_count??"unknown")+"; advertised total: "+(d.total_count??"not supplied")+"; response shape: "+(d.upstream_shape||"unknown")+". "+(d.diagnostic||""),voices.size>=1000?"success":"error");}if(!voices.size)status("No voices returned. Check the voice provider configuration.");}catch(e){$("ttsVoice").replaceChildren(new Option("Voices unavailable",""));$("ttsCount").textContent="0 voices loaded";status(e.message||"Could not load voices.","error")}finally{loading=false;$("ttsRefresh").disabled=false}}
function detectEmotion(text){const t=text.toLowerCase();if(/\b(hate|furious|angry|गुस्सा|ક્રોધ|ગુસ્સો)\b/.test(t))return "angry";if(/\b(sad|sorry|miss you|lonely|cry|दुख|उदास|દુઃખ|ઉદાસ)\b/.test(t))return "sad";if(/\b(love|darling|sweetheart|romantic|प्यार|प्रेम|પ્રેમ|વ્હાલા)\b/.test(t))return "romantic";if(/\b(wow|amazing|happy|great|excited|वाह|ખુશ|ખુશી)\b/.test(t))return "happy";return "professional"}async function generate(){if(generating)return;const text=$("ttsText").value.trim(),voice_id=$("ttsVoice").value;if(!text)return status("Enter text first.","error");if(!voice_id)return status("Select a voice first.","error");generating=true;$("ttsGenerate").disabled=true;$("ttsResult").hidden=true;status("Generating speech…");try{const provider=$("ttsProvider").value;const language=$("ttsLanguage").value;const selectedVoice=voices.get(voice_id);const requestedEmotion=$("ttsEmotion").value;const emotion=requestedEmotion==="auto"?detectEmotion(text):requestedEmotion;const payload=provider==="ttsai"?{provider:"ttsai",text,voice_id:selectedVoice?.voice_id||voice_id,model_id:(selectedVoice?.model_id||selectedVoice?.category||$("ttsModel").value),language,format:"mp3",emotion}:provider==="freetts"?{provider:"freetts",text,voice_id:selectedVoice?.voice_id||voice_id,language,format:"mp3",emotion}:{provider:"elevenlabs",text,voice_id:selectedVoice?.voice_id||voice_id,model_id:"eleven_multilingual_v2",output_format:"mp3_44100_128",emotion};const r=await request("/api/tts",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});const blob=await r.blob();if(!blob.size)throw Error("Provider returned empty audio.");if(audioUrl)URL.revokeObjectURL(audioUrl);audioUrl=URL.createObjectURL(blob);$("ttsAudio").src=audioUrl;$("ttsDownload").href=audioUrl;$("ttsResult").hidden=false;status(provider==="ttsai"?"Free-model TTS audio generated successfully. No ElevenLabs credits used.":provider==="freetts"?"FreeTTS neural audio generated. Free-tier character limits apply.":"ElevenLabs audio generated successfully. Your ElevenLabs plan quota may apply.","success")}catch(e){status(e.message||"Speech generation failed.","error")}finally{generating=false;$("ttsGenerate").disabled=false}}
function syncProvider(){load()}$("ttsProvider").addEventListener("change",syncProvider);$("ttsModel").addEventListener("change",()=>{if($("ttsProvider").value==="ttsai")load()});try{const draft=sessionStorage.getItem("voiceai_tts_text");if(draft!==null){$("ttsText").value=draft;$("ttsChars").textContent=draft.length;sessionStorage.removeItem("voiceai_tts_text")}}catch(_){};$("ttsText").addEventListener("input",()=>{$("ttsChars").textContent=$("ttsText").value.length});$("ttsLanguage").addEventListener("change",()=>{if($("ttsProvider").value==="ttsai")load();else render()});$("ttsVoice").addEventListener("change",()=>{$("ttsPreview").disabled=!voices.has($("ttsVoice").value);$("ttsPreviewAudio").hidden=true;});$("ttsPreview").addEventListener("click",()=>{const v=voices.get($("ttsVoice").value);if(!v)return status("Select a voice first.","error");if(!v.preview_url)return status("This provider did not supply a preview for the selected voice. Generate speech to hear it.","error");try{const u=new URL(v.preview_url);if(u.protocol!=="https:")throw Error();$("ttsPreviewAudio").src=u.href;$("ttsPreviewAudio").hidden=false;$("ttsPreviewAudio").play().catch(()=>status("Tap play on the preview player to listen.","error"));}catch{status("Voice preview URL is invalid.","error")}});$("ttsRefresh").addEventListener("click",load);$("ttsGenerate").addEventListener("click",generate);try{const saved=JSON.parse(sessionStorage.getItem("voiceai_selected_voice")||"null");if(saved?.provider)$("ttsProvider").value=saved.provider}catch(_){}syncProvider();window.addEventListener("beforeunload",()=>{if(audioUrl)URL.revokeObjectURL(audioUrl)});
})();
</script><script>if(window.lucide)lucide.createIcons();</script></body></html>
