<!doctype html>
<html lang="en">
<head><script src="https://unpkg.com/lucide@latest"></script>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Voice AI Studio — Text to Speech</title>
<link rel="stylesheet" href="./style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./supabase-config.js"></script><script src="./api-config.js"></script>
<style>
.tts-wrap{max-width:900px;margin:32px auto;padding:20px}.tts-card{padding:22px;border:1px solid #334155;border-radius:16px;margin:18px 0}
.tts-card label{display:block;margin:14px 0 6px;font-weight:600}.tts-card textarea,.tts-card select,.tts-card input{box-sizing:border-box;width:100%;padding:12px;border-radius:9px}
.tts-card textarea{min-height:150px}.tts-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}.tts-btn{padding:12px 18px;margin:12px 8px 0 0;border-radius:9px;cursor:pointer}
#ttsStatus{white-space:pre-wrap;overflow-wrap:anywhere;margin-top:14px}#ttsAudio{width:100%;margin-top:16px}
@media(max-width:600px){.tts-row{grid-template-columns:1fr}.tts-wrap{padding:12px}}
</style></head>
<body>
<header class="navbar">
<a href="index.html" class="logo"><span class="logo-mark"><i data-lucide="audio-lines"></i></span><span>VoiceAI</span></a>
<nav class="nav-links"><a href="index.html">Home</a><a href="tools.html">AI Tools</a><a href="voices.html">Voices</a><a href="studio.html">Studio</a><a href="pricing.html">Pricing</a></nav>
<div class="nav-actions"><a href="login.html" class="nav-login">Login</a><a href="signup.html" class="primary-btn">Get Started</a></div>
</header>
<main class="tts-wrap">
<h1>Text to Speech</h1><p>Generate speech with free TTS voices. No ElevenLabs credits required.</p>
<section class="tts-card">
<label for="ttsText">Text</label><textarea id="ttsText" maxlength="500" placeholder="Type up to 500 characters to speak..."></textarea>
<p><small><span id="ttsChars">0</span>/500 characters (free testing)</small></p>
<div class="tts-row"><div><label for="ttsLanguage">Voice language</label><select id="ttsLanguage"><option value="hindi" selected>Hindi</option><option value="gujarati">Gujarati</option><option value="english">English</option></select></div><div><label for="ttsEmotion">Voice emotion</label><select id="ttsEmotion"><option value="auto" selected>Automatic emotion</option><option value="neutral">Neutral</option><option value="happy">Happy / excited</option><option value="sad">Sad / emotional</option><option value="angry">Angry / intense</option><option value="romantic">Romantic / gentle</option><option value="professional">Professional / confident</option></select></div></div><label for="ttsVoice">Voice</label><select id="ttsVoice"><option value="">Loading voices…</option></select>
<label for="ttsProvider">Voice provider</label><select id="ttsProvider"><option value="ttsai" selected>Free TTS</option></select><label for="ttsModel">Model</label><select id="ttsModel"><option value="kokoro">Kokoro (free model)</option><option value="piper">Piper (free model)</option><option value="vits">VITS (free model)</option><option value="melotts">MeloTTS (free model)</option></select>
<button class="tts-btn" id="ttsRefresh" type="button">Refresh Voices</button><button class="tts-btn" id="ttsGenerate" type="button">Generate Speech</button>
<p id="ttsCount">0 voices loaded</p><div id="ttsStatus" role="status" aria-live="polite"></div>
</section><section class="tts-card" id="ttsResult" hidden><h2>Generated audio</h2><audio id="ttsAudio" controls></audio><p><a id="ttsDownload" download="voiceai-speech.mp3">Download audio</a></p></section>
</main>
<script>
(()=>{"use strict";
const $=id=>document.getElementById(id), voices=new Map();let audioUrl=null,loading=false,generating=false;
const status=(s,kind="")=>{$("ttsStatus").textContent=s;$("ttsStatus").className=kind};
async function request(url,options={}){const headers={...(options.headers||{})};try{const c=window.supabaseClient;if(c?.auth?.getSession){const {data}=await c.auth.getSession();if(data?.session?.access_token)headers.Authorization="Bearer "+data.session.access_token}}catch(_){}const r=await fetch(url,{...options,headers});if(!r.ok){let m="Request failed ("+r.status+")";try{const p=await r.json();m=p.error||p.message||m}catch{}throw Error(m)}return r}
function render(){const language=$("ttsLanguage").value,select=$("ttsVoice"),prev=select.value;select.replaceChildren(new Option("Select a voice…",""));const all=[...voices.values()];const matches=all.filter(v=>{const details=String(v.name+" "+(v.description||"")+" "+(v.category||"")+" "+JSON.stringify(v.labels||{})).toLowerCase();const lang=String(v.labels?.language||v.language||"").toLowerCase();const hindi=/hindi|hi-in|\\bhi\\b/.test(lang)||/hindi|hindustani|indian hindi/i.test(details);const english=/english|en-us|en-gb|en-in|\\ben\\b/.test(lang)||/english|american accent|british accent|australian accent/i.test(details);const gujarati=/gujarati|guj|gu-in/.test(lang)||/gujarati|gujju/i.test(details);return language==="hindi"?hindi:language==="gujarati"?gujarati:english});const list=matches.length?matches:all;for(const v of list)select.add(new Option(v.name+" — "+(v.category||v.labels?.language||"Voice"),v.voice_id));if([...select.options].some(o=>o.value===prev))select.value=prev;$("ttsCount").textContent=list.length+(matches.length?" matching voices loaded":" voices loaded (language labels unavailable; showing all)");}
async function load(){if(loading)return;loading=true;$("ttsRefresh").disabled=true;$("ttsVoice").replaceChildren(new Option("Loading voices…",""));const provider=$("ttsProvider").value;status(provider==="ttsai"?"Loading free-provider voices…":"Loading ElevenLabs shared and account voices…");try{voices.clear();const sources=provider==="ttsai"?["ttsai"]:["library","account"];for(const source of sources){let nextToken="",page=0;do{const url=new URL("/api/voices",window.location.href);url.searchParams.set("source",source);if(source==="ttsai"){url.searchParams.set("model", $("ttsModel").value);const languageCode={hindi:"hi",gujarati:"gu",english:"en"}[$("ttsLanguage").value];if(languageCode)url.searchParams.set("language",languageCode);if(page>0)url.searchParams.set("page",String(page+1));if(nextToken)url.searchParams.set("next_page_token",nextToken);}if(source==="library"&&page>0)url.searchParams.set("page",String(page+1));if(source==="account"&&nextToken)url.searchParams.set("next_page_token",nextToken);const response=await request(url.toString());const p=await response.json();if(!p.success||!Array.isArray(p.voices))throw Error(p.error||"Invalid voice response.");p.voices.forEach(v=>{if(v?.voice_id&&v?.name)voices.set(v.voice_id,{...v,provider:source})});nextToken=typeof p.next_page_token==="string"?p.next_page_token:"";page++;status("Loading voices: "+voices.size+(Number.isFinite(Number(p.total_count))&&Number(p.total_count)>0?" / "+Number(p.total_count):"")+" found…");}while(nextToken&&page<10);}render();try{const saved=JSON.parse(sessionStorage.getItem("voiceai_selected_voice")||"null");if(saved?.voice_id&&voices.has(saved.voice_id))$("ttsVoice").value=saved.voice_id;sessionStorage.removeItem("voiceai_selected_voice")}catch(_){}status(voices.size+" free TTS voices loaded.","success");if(!voices.size)status("No voices returned. Check the voice provider configuration.");}catch(e){$("ttsVoice").replaceChildren(new Option("Voices unavailable",""));$("ttsCount").textContent="0 voices loaded";status(e.message||"Could not load voices.","error")}finally{loading=false;$("ttsRefresh").disabled=false}}
function detectEmotion(text){const t=text.toLowerCase();if(/\b(hate|furious|angry|गुस्सा|ક્રોધ|ગુસ્સો)\b/.test(t))return "angry";if(/\b(sad|sorry|miss you|lonely|cry|दुख|उदास|દુઃખ|ઉદાસ)\b/.test(t))return "sad";if(/\b(love|darling|sweetheart|romantic|प्यार|प्रेम|પ્રેમ|વ્હાલા)\b/.test(t))return "romantic";if(/\b(wow|amazing|happy|great|excited|वाह|ખુશ|ખુશી)\b/.test(t))return "happy";return "professional"}async function generate(){if(generating)return;const text=$("ttsText").value.trim(),voice_id=$("ttsVoice").value;if(!text)return status("Enter text first.","error");if(!voice_id)return status("Select a voice first.","error");generating=true;$("ttsGenerate").disabled=true;$("ttsResult").hidden=true;status("Generating speech…");try{const provider=$("ttsProvider").value;const language=$("ttsLanguage").value;const selectedVoice=voices.get(voice_id);const requestedEmotion=$("ttsEmotion").value;const emotion=requestedEmotion==="auto"?detectEmotion(text):requestedEmotion;const r=await request("/api/tts",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(provider==="ttsai"?{provider:"ttsai",text,voice_id,model_id:(selectedVoice?.model_id||selectedVoice?.category||$("ttsModel").value),language,format:"mp3",emotion}:{provider:"elevenlabs",text,voice_id,model_id:$("ttsModel").value,output_format:"mp3_44100_128",emotion})});const blob=await r.blob();if(!blob.size)throw Error("Provider returned empty audio.");if(audioUrl)URL.revokeObjectURL(audioUrl);audioUrl=URL.createObjectURL(blob);$("ttsAudio").src=audioUrl;$("ttsDownload").href=audioUrl;$("ttsResult").hidden=false;status("Free speech generated successfully. No ElevenLabs credits used.","success")}catch(e){status(e.message||"Speech generation failed.","error")}finally{generating=false;$("ttsGenerate").disabled=false}}
function syncProvider(){$("ttsModel").value="kokoro";load()}$("ttsProvider").addEventListener("change",syncProvider);$("ttsModel").addEventListener("change",()=>{if($("ttsProvider").value==="ttsai")load()});try{const draft=sessionStorage.getItem("voiceai_tts_text");if(draft!==null){$("ttsText").value=draft;$("ttsChars").textContent=draft.length;sessionStorage.removeItem("voiceai_tts_text")}}catch(_){};$("ttsText").addEventListener("input",()=>{$("ttsChars").textContent=$("ttsText").value.length});$("ttsLanguage").addEventListener("change",()=>{if($("ttsProvider").value==="ttsai")load();else render()});$("ttsRefresh").addEventListener("click",load);$("ttsGenerate").addEventListener("click",generate);try{const saved=JSON.parse(sessionStorage.getItem("voiceai_selected_voice")||"null");if(saved?.provider)$("ttsProvider").value=saved.provider}catch(_){}syncProvider();window.addEventListener("beforeunload",()=>{if(audioUrl)URL.revokeObjectURL(audioUrl)});
})();
</script><script>if(window.lucide)lucide.createIcons();</script></body></html>
