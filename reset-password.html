<!doctype html>
<html lang="en"><head><script src="https://unpkg.com/lucide@latest"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset password | Voice AI Studio</title><link rel="stylesheet" href="./style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./supabase-config.js"></script><style>.auth-wrap{max-width:520px;margin:48px auto;padding:24px}.auth-card{padding:26px;border:1px solid #334155;border-radius:18px}.auth-card label{display:block;margin:14px 0 6px}.auth-card input{box-sizing:border-box;width:100%;padding:12px;border-radius:9px}.auth-card button{margin-top:18px;padding:12px;width:100%;cursor:pointer}.auth-status{min-height:1.5em;white-space:pre-wrap}.error{color:#f87171}.success{color:#4ade80}</style></head>
<body>
<header class="navbar">
<a href="index.html" class="logo"><span class="logo-mark"><i data-lucide="audio-lines"></i></span><span>VoiceAI</span></a>
<nav class="nav-links"><a href="index.html">Home</a><a href="tools.html">AI Tools</a><a href="voices.html">Voices</a><a href="studio.html">Studio</a><a href="pricing.html">Pricing</a></nav>

<header class="site-header"><a href="./index.html" class="logo">Voice AI Studio</a><nav><a href="./login.html">Log in</a><a href="./signup.html">Create account</a></nav></header><main class="container auth-wrap"><section class="auth-card"><h1>Set a new password</h1><p>Choose a new password for your account.</p><form id="passwordForm"><label for="password">New password</label><input id="password" type="password" autocomplete="new-password" minlength="8" required><label for="confirm">Confirm password</label><input id="confirm" type="password" autocomplete="new-password" minlength="8" required><button id="saveBtn" class="button button-primary" type="submit">Update password</button></form><p id="status" class="auth-status" role="status" aria-live="polite"></p><a href="./login.html">Back to log in</a></section></main><script>(()=>{const form=document.getElementById("passwordForm"),status=document.getElementById("status"),btn=document.getElementById("saveBtn");form.addEventListener("submit",async e=>{e.preventDefault();const password=document.getElementById("password").value,confirm=document.getElementById("confirm").value;if(password!==confirm){status.textContent="Passwords do not match.";status.className="auth-status error";return}if(!window.supabaseClient?.auth){status.textContent="Supabase client failed to initialize.";status.className="auth-status error";return}btn.disabled=true;status.textContent="Updating password…";try{const {data,error}=await window.supabaseClient.auth.updateUser({password});if(error)throw error;if(!data.user)throw Error("Reset session missing or expired. Request a new reset link.");status.textContent="Password updated. Redirecting to login…";status.className="auth-status success";await window.supabaseClient.auth.signOut();setTimeout(()=>location.href=new URL("login.html",location.href).href,1200)}catch(err){status.textContent=err.message||"Could not update password. Request a new reset link.";status.className="auth-status error"}finally{btn.disabled=false}})})();</script><script>if(window.lucide)lucide.createIcons();</script></body></html>
