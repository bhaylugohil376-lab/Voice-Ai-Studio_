<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Voice Isolator | Voice AI Studio</title><link rel="stylesheet" href="./style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./supabase-config.js"></script><script src="./api-config.js"></script>
<style>
.tool-wrap{max-width:850px;margin:30px auto;padding:18px}.tool-card{border:1px solid #334155;border-radius:16px;padding:22px;margin:18px 0}.tool-card label{display:block;margin:14px 0 7px;font-weight:600}.tool-card input{box-sizing:border-box;width:100%;padding:12px;border-radius:9px}.tool-btn{padding:12px 18px;margin-top:16px;border-radius:9px;cursor:pointer}.tool-status{white-space:pre-wrap;overflow-wrap:anywhere;margin-top:14px}.tool-audio{width:100%;margin-top:15px}
</style></head>
<body><header class="site-header"><a href="index.html" class="logo">VoiceAI</a><nav><a href="tts.html">Text to Speech</a><a href="voice-library.html">Voice Library</a><a href="changer.html">Voice Changer</a><a href="studio.html">Studio</a></nav></header>
<main class="tool-wrap"><h1>Voice Isolator</h1><p>Remove background noise from an audio recording using ElevenLabs Audio Isolation. Requires sign-in and a configured provider key.</p>
<section class="tool-card"><label for="isolatorAudio">Source audio (up to 4 MB)</label><input id="isolatorAudio" type="file" accept="audio/*">
<button class="tool-btn" id="isolatorRun" type="button">Isolate voice</button><div id="isolatorStatus" class="tool-status" role="status" aria-live="polite"></div></section>
<section class="tool-card" id="isolatorResult" hidden><h2>Isolated audio</h2><audio id="isolatorPlayer" class="tool-audio" controls></audio><p><a id="isolatorDownload" download="voiceai-isolated.mp3">Download isolated audio</a></p></section></main>
<script>
(()=>{"use strict";const $=id=>document.getElementById(id);let audioUrl=null,running=false;const status=s=>{$("isolatorStatus").textContent=s};
async function token(){const c=window.supabaseClient;if(!c?.auth?.getSession)throw Error("Supabase client is not initialized.");const {data,error}=await c.auth.getSession();if(error)throw Error(error.message);if(!data.session?.access_token)throw Error("Please sign in before using Voice Isolator.");return data.session.access_token}
async function run(){if(running)return;const file=$("isolatorAudio").files[0];if(!file)return status("Choose an audio file first.");if(file.size>4*1024*1024)return status("Audio must be 4 MB or smaller.");running=true;$("isolatorRun").disabled=true;$("isolatorResult").hidden=true;status("Removing background noise…");try{const t=await token(),base64=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(String(reader.result).split(",")[1]||"");reader.onerror=()=>reject(Error("Could not read the audio file."));reader.readAsDataURL(file)});const r=await fetch("/api/voice-isolator",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+t},body:JSON.stringify({audio_base64:base64,mime_type:file.type||"audio/mpeg"})});if(!r.ok){let m="Isolation failed ("+r.status+")";try{m=(await r.json()).error||m}catch{}throw Error(m)}const blob=await r.blob();if(!blob.size)throw Error("Provider returned empty audio.");if(audioUrl)URL.revokeObjectURL(audioUrl);audioUrl=URL.createObjectURL(blob);$("isolatorPlayer").src=audioUrl;$("isolatorDownload").href=audioUrl;$("isolatorResult").hidden=false;status("Voice isolation completed.");}catch(e){status(e.message||"Voice isolation failed.");}finally{running=false;$("isolatorRun").disabled=false}}
$("isolatorRun").addEventListener("click",run);window.addEventListener("beforeunload",()=>{if(audioUrl)URL.revokeObjectURL(audioUrl)})})();
</script></body></html>
