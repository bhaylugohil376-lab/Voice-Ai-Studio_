<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050b18"><title>Log in | Voice AI Studio</title><link rel="stylesheet" href="./style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./supabase-config.js"></script>
<style>.auth-wrap{max-width:520px;margin:48px auto;padding:24px}.auth-card{padding:26px;border:1px solid #334155;border-radius:18px;background:rgba(15,23,42,.65)}.auth-card label{display:block;margin:14px 0 6px}.auth-card input{box-sizing:border-box;width:100%;padding:12px;border-radius:9px}.auth-card button{margin-top:18px;padding:12px 18px;width:100%;cursor:pointer}.auth-status{min-height:1.5em;white-space:pre-wrap}.auth-links{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.auth-status.error{color:#f87171}.auth-status.success{color:#4ade80}</style></head>
<body><header class="site-header"><a href="./index.html" class="logo">Voice AI Studio</a><nav><a href="./tts.html">Text to Speech</a><a href="./voice-library.html">Voice Library</a><a href="./studio.html">Studio</a><a href="./pricing.html">Pricing</a></nav></header>
<main class="container auth-wrap"><section class="auth-card"><p class="eyebrow">VOICE AI STUDIO</p><h1>Log in</h1><p>Sign in to access your voice tools and saved work.</p><form id="loginForm"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required minlength="6"><button id="submitBtn" class="button button-primary" type="submit">Log in</button></form><p id="authStatus" class="auth-status" role="status" aria-live="polite"></p><div class="auth-links"><a href="./forgot-password.html">Forgot password?</a><a href="./signup.html">Create account</a></div></section></main>
<script>(()=>{const form=document.getElementById("loginForm"),status=document.getElementById("authStatus"),btn=document.getElementById("submitBtn");const say=(m,k="")=>{status.textContent=m;status.className="auth-status "+k};form.addEventListener("submit",async e=>{e.preventDefault();if(!window.supabaseClient?.auth){say("Supabase client failed to initialize. Check network access and Supabase configuration.","error");return}btn.disabled=true;btn.textContent="Signing in…";say("");try{const {data,error}=await window.supabaseClient.auth.signInWithPassword({email:form.email.value.trim(),password:form.password.value});if(error)throw error;if(!data.session)throw Error("Sign-in needs confirmation. Check your email.");say("Signed in successfully. Opening Text to Speech…","success");location.href=new URL("tts.html",location.href).href}catch(err){say(err.message||"Could not sign in. Please try again.","error")}finally{btn.disabled=false;btn.textContent="Log in"}})})();</script></body></html>
