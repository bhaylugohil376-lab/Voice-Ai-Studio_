name: VoiceAI checks
on:
  push:
    branches: [main, "fix/**", "feat/**"]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  syntax-and-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Check JavaScript syntax
        run: npm run check
      - name: Run test script
        run: npm test
