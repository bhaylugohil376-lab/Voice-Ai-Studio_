<!doctype html>
<html lang="en"><head><script src="https://unpkg.com/lucide@latest"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050b18"><title>Create account | Voice AI Studio</title><link rel="stylesheet" href="./style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./supabase-config.js"></script>
<style>.auth-wrap{max-width:520px;margin:48px auto;padding:24px}.auth-card{padding:26px;border:1px solid #334155;border-radius:18px;background:rgba(15,23,42,.65)}.auth-card label{display:block;margin:14px 0 6px}.auth-card input{box-sizing:border-box;width:100%;padding:12px;border-radius:9px}.auth-card button{margin-top:18px;padding:12px 18px;width:100%;cursor:pointer}.auth-status{min-height:1.5em;white-space:pre-wrap}.auth-status.error{color:#f87171}.auth-status.success{color:#4ade80}</style></head>
<body>
<header class="navbar">
<a href="index.html" class="logo"><span class="logo-mark"><i data-lucide="audio-lines"></i></span><span>VoiceAI</span></a>
<nav class="nav-links"><a href="index.html">Home</a><a href="tools.html">AI Tools</a><a href="voices.html">Voices</a><a href="studio.html">Studio</a><a href="pricing.html">Pricing</a></nav>
<div class="nav-actions"><a href="login.html" class="nav-login">Login</a><a href="signup.html" class="primary-btn">Get Started</a></div>
</header>
<header class="site-header"><a href="./index.html" class="logo">Voice AI Studio</a><nav><a href="./tts.html">Text to Speech</a><a href="./voice-library.html">Voice Library</a><a href="./studio.html">Studio</a><a href="./pricing.html">Pricing</a></nav></header>
<main class="container auth-wrap"><section class="auth-card"><p class="eyebrow">VOICE AI STUDIO</p><h1>Create account</h1><p>Register with your email to use Voice AI Studio.</p><form id="signupForm"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="new-password" required minlength="8"><small>Use at least 8 characters.</small><button id="submitBtn" class="button button-primary" type="submit">Create account</button></form><p id="authStatus" class="auth-status" role="status" aria-live="polite"></p><p>Already registered? <a href="./login.html">Log in</a></p></section></main>
<script>(()=>{const form=document.getElementById("signupForm"),status=document.getElementById("authStatus"),btn=document.getElementById("submitBtn");const say=(m,k="")=>{status.textContent=m;status.className="auth-status "+k};form.addEventListener("submit",async e=>{e.preventDefault();if(!window.supabaseClient?.auth){say("Supabase client failed to initialize. Check network access and Supabase configuration.","error");return}btn.disabled=true;btn.textContent="Creating account…";say("");try{const email=form.email.value.trim(),password=form.password.value;const {data,error}=await window.supabaseClient.auth.signUp({email,password,options:{emailRedirectTo:new URL("login.html",location.href).href}});if(error)throw error;if(data.session){say("Account created. Opening Text to Speech…","success");location.href=new URL("tts.html",location.href).href;return}say("Account created. Check your email for the confirmation link, then log in.","success");form.reset()}catch(err){say(err.message||"Could not create account. Please try again.","error")}finally{btn.disabled=false;btn.textContent="Create account"}})})();</script><script>if(window.lucide)lucide.createIcons();</script></body></html>
